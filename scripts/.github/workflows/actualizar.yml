name: Actualizar datos
on:
  schedule:
    - cron: '*/5 17-23,0-3 * * *'
    - cron: '0 4-16/3 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/fetch.mjs
      - name: Guardar cambios
        run: |
          git config user.name "popular-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data
          git diff --staged --quiet || (git commit -m "Actualizar datos" && git push)
